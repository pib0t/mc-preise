name: Deploy encrypted site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install staticrypt
        run: npm install -g staticrypt
      - name: Prepare deploy dir
        run: |
          mkdir -p deploy
          # alles ausser .git und deploy/ kopieren
          rsync -a --exclude='.git' --exclude='deploy' --exclude='.github' --exclude='.staticrypt.json' . deploy/
      - name: Encrypt
        env:
          STATICRYPT_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          STATICRYPT_PASSWORD="$STATICRYPT_PASSWORD" staticrypt deploy -r --short --title "Geschützte Minecraft-Seite"
          # verschlüsselte Dateien in deploy-Wurzel mergen
          rsync -a encrypted/deploy/ deploy/
          rm -rf encrypted
      - uses: actions/upload-pages-artifact@v3
        with:
          path: deploy

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
